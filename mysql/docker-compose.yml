name: db-fault-lab

services:
  mysql-master:
    image: mysql:8.0
    container_name: dfl-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./conf/master.cnf:/etc/mysql/conf.d/zz-lab.cnf:ro
      - ./conf/master-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - master-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql-slave-1:
    image: mysql:8.0
    container_name: dfl-slave-1
    restart: unless-stopped
    depends_on:
      mysql-master:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./conf/slave.cnf:/etc/mysql/conf.d/zz-lab.cnf:ro
      - slave1-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-rootpass", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql-slave-2:
    image: mysql:8.0
    container_name: dfl-slave-2
    restart: unless-stopped
    depends_on:
      mysql-master:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ./conf/slave-2.cnf:/etc/mysql/conf.d/zz-lab.cnf:ro
      - slave2-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-rootpass", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  master-data:
  slave1-data:
  slave2-data:
